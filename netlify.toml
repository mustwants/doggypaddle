# File: netlify.toml
# Netlify publishes ONLY the site/ folder. Backend code, tests, and docs are never served.

[build]
  publish = "site"
  command = ""

[functions]
  directory = "netlify/functions"

# ---------------------------------------------------------------------------
# Old domain -> new domain (permanent). dogpaddle.club must stay attached to this
# Netlify project as a domain alias for these rules to run.
# ---------------------------------------------------------------------------

[[redirects]]
  from = "https://dogpaddle.club/*"
  to = "https://pupswim.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://dogpaddle.club/*"
  to = "https://pupswim.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.dogpaddle.club/*"
  to = "https://pupswim.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.dogpaddle.club/*"
  to = "https://pupswim.com/:splat"
  status = 301
  force = true

# ---------------------------------------------------------------------------
# Old page addresses -> new page addresses
# ---------------------------------------------------------------------------

[[redirects]]
  from = "/store"
  to = "/shop/"
  status = 301

[[redirects]]
  from = "/store/*"
  to = "/shop/"
  status = 301

[[redirects]]
  from = "/waiver/waiver.html"
  to = "/waiver/"
  status = 301

[[redirects]]
  from = "/calendar/*"
  to = "/book/"
  status = 301

[[redirects]]
  from = "/subscription.html"
  to = "/club/"
  status = 301

[[redirects]]
  from = "/photos/*"
  to = "/#gallery"
  status = 301

# ---------------------------------------------------------------------------
# Security headers
# ---------------------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
